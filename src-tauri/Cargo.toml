[package]
name = "lirio"
version = "0.2.9"
description = "Lirio: el launcher de tus bots"
authors = ["Lirio"]
license = ""
edition = "2021"
rust-version = "1.80"
default-run = "lirio"

[lib]
name = "lirio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dirs = "5"
log = "0.4"
ureq = { version = "2.10", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Ioctl",
  "Win32_System_IO",
] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
# compilaciones de prueba ligeras: sin información de depuración ni caché incremental (ocupan mucho disco)
debug = 0
incremental = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Las miniaturas se reducen en Lirio: estas librerías van siempre optimizadas para velocidad (el resto, por tamaño).
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.zune-core]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3
